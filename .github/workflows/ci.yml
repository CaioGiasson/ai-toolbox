name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Sintaxe do sync.sh
        run: bash -n sync.sh

      - name: Catálogos de assessment em sincronia com o checklist
        run: |
          python3 -X utf8 scripts/gen-assessment-catalog.py
          git diff --exit-code -- skills/ || {
            echo "::error::Catálogos divergem de docs/application-assessment-v3.md. Rode 'python -X utf8 scripts/gen-assessment-catalog.py' e commite o resultado."
            exit 1
          }

      - name: Sync em HOME temporário (instala e é idempotente)
        run: |
          export HOME="$(mktemp -d)"
          bash sync.sh
          for dir in skills/*/; do
            name="$(basename "$dir")"
            [[ -f "$dir/SKILL.md" ]] || continue
            diff -r "$dir" "$HOME/.claude/skills/$name"
          done
          bash sync.sh | grep -q "Nenhuma skill nova para sincronizar"
